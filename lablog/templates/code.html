{% macro code_block(id, label, text, copy_label='Скопировать пример') %}
<div class="code-block">
    <div class="code-heading">
        <span>{{ label }}</span>
        <button class="copy-button" type="button" data-copy="{{ id }}" aria-label="{{ copy_label }}" hidden>Копировать</button>
    </div>
    <pre id="{{ id }}" aria-label="{{ label }}" tabindex="0"><code>{{ text }}</code></pre>
</div>
{% endmacro %}
