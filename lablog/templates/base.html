<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>{% block title %}Журнал inslopnia{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='inslopnia.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='ui.js') }}"></script>
</head>
<body>
    <a class="skip-link" href="#main">К содержимому</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% block brand_url %}{{ url_for('index') }}{% endblock %}">
                <img src="{{ url_for('static', filename='inslopnia.svg') }}" width="40" height="24" alt="">
                <span class="brand-name">inslopnia</span>
                <span class="brand-section">{% block brand_section %}Лабораторный журнал{% endblock %}</span>
            </a>
            {% block header_actions %}{% endblock %}
        </div>
    </header>
    <main id="main" class="{% block main_class %}page{% endblock %}" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <p id="copy-status" class="visually-hidden" role="status"></p>
</body>
</html>
